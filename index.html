<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QA Automation Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .header {
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      padding: 30px 40px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .summary-card .number {
      font-size: 30px;
      font-weight: bold;
    }

    .summary-card .label {
      color: #6b7280;
      margin-top: 5px;
    }

    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f9fafb;
      text-align: left;
      padding: 16px;
      font-size: 13px;
      color: #6b7280;
      text-transform: uppercase;
    }

    td {
      padding: 18px 16px;
      border-top: 1px solid #e5e7eb;
    }

    .module {
      font-weight: 600;
      font-size: 15px;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .pass {
      background: #dcfce7;
      color: #166534;
    }

    .fail {
      background: #fee2e2;
      color: #991b1b;
    }

    .not-run {
      background: #e5e7eb;
      color: #4b5563;
    }

    .report-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .report-link:hover {
      text-decoration: underline;
    }

    .never {
      color: #9ca3af;
    }

    .refresh {
      float: right;
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .refresh:hover {
      background: #1d4ed8;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      padding: 30px;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .table-container {
        overflow-x: auto;
      }

      table {
        min-width: 700px;
      }
    }

    @media (max-width: 500px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .header {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <button class="refresh" onclick="loadDashboard()">
      Refresh
    </button>

    <h1>QA Automation Dashboard</h1>
    <p>Playwright Test Execution Dashboard</p>

  </div>

  <div class="container">

    <div class="summary">

      <div class="summary-card">
        <div class="number" id="totalModules">5</div>
        <div class="label">Total Modules</div>
      </div>

      <div class="summary-card">
        <div class="number" id="passedModules">0</div>
        <div class="label">Passed</div>
      </div>

      <div class="summary-card">
        <div class="number" id="failedModules">0</div>
        <div class="label">Failed</div>
      </div>

      <div class="summary-card">
        <div class="number" id="notRunModules">0</div>
        <div class="label">Not Run</div>
      </div>

    </div>

    <div class="table-container">

      <table>

        <thead>
          <tr>
            <th>Module</th>
            <th>Last Run</th>
            <th>Status</th>
            <th>Report</th>
          </tr>
        </thead>

        <tbody id="moduleTable"></tbody>

      </table>

    </div>

  </div>

  <div class="footer">
    QA Automation Dashboard
  </div>


<script>

const modules = [
  {
    name: "Playground",
    path: "reports/playground"
  },
  {
    name: "Assertions",
    path: "reports/assertions"
  },
  {
    name: "Frames Tab",
    path: "reports/frames-tab"
  },
  {
    name: "Locators",
    path: "reports/locators"
  },
  {
    name: "Login",
    path: "reports/login"
  }
];


async function getMetadata(module) {

  try {

    const response = await fetch(
      `${module.path}/metadata.json?timestamp=${Date.now()}`,
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      return null;
    }

    return await response.json();

  } catch (error) {

    console.error(
      `Could not load metadata for ${module.name}`,
      error
    );

    return null;
  }
}


function formatDate(dateString) {

  if (!dateString) {
    return "Never";
  }

  const date = new Date(dateString);

  if (isNaN(date.getTime())) {
    return "Unknown";
  }

  return date.toLocaleString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}


async function loadDashboard() {

  const table = document.getElementById("moduleTable");

  table.innerHTML = "";

  let passed = 0;
  let failed = 0;
  let notRun = 0;


  for (const module of modules) {

    const metadata = await getMetadata(module);

    const row = document.createElement("tr");


    // No metadata = module has never run
    if (!metadata) {

      notRun++;

      row.innerHTML = `
        <td class="module">
          ${module.name}
        </td>

        <td>
          <span class="never">
            Never
          </span>
        </td>

        <td>
          <span class="status not-run">
            Not Run
          </span>
        </td>

        <td>
          -
        </td>
      `;

    } else {

      const status =
        metadata.status
          ? metadata.status.toLowerCase()
          : "failed";


      if (status === "passed") {
        passed++;
      } else {
        failed++;
      }


      let statusClass = "fail";
      let statusText = "FAIL";

      if (status === "passed") {
        statusClass = "pass";
        statusText = "PASS";
      }


      row.innerHTML = `
        <td class="module">
          ${module.name}
        </td>

        <td>
          ${formatDate(metadata.lastRun)}
        </td>

        <td>
          <span class="status ${statusClass}">
            ${statusText}
          </span>
        </td>

        <td>
          <a
            class="report-link"
            href="${module.path}/"
            target="_blank">
            View Report →
          </a>
        </td>
      `;
    }


    table.appendChild(row);
  }


  document.getElementById("totalModules").textContent =
    modules.length;

  document.getElementById("passedModules").textContent =
    passed;

  document.getElementById("failedModules").textContent =
    failed;

  document.getElementById("notRunModules").textContent =
    notRun;
}


loadDashboard();

</script>

</body>
</html>
